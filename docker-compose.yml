services:
  postgres:
    image: postgres:16-alpine
    container_name: mohef-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mohef_booking_db}
      POSTGRES_USER: ${POSTGRES_USER:-booking_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking123}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./.docker/postgres-data:/var/lib/postgresql/data
      - ./.docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
